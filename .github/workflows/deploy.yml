name: release
on:
  push:
    tags:
      - 'v4.*'
permissions:
  contents: write
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - run: go vet ./... && go test -race ./...
  build:
    needs: linux-tests
    runs-on: windows-2022
    environment: production
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        path-type: inherit
        install: rsync
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - run: bash ./build --build --test
      env:
        MSYS2_ARG_CONV_EXCL: '*'
    - run: bash ./scripts/prepare-release
    - name: Verify unsigned architecture, subsystem and C# version
      shell: pwsh
      run: ./tests/release/check-artifacts.ps1
    - uses: 131/gh-actions/sign-binaries@v1
      with:
        files: output/release/*.exe
        signing-server: ${{ secrets.SIGNING_SERVER }}
    - name: Verify eight Authenticode signatures, timestamps and checksums
      shell: pwsh
      run: ./tests/release/check-artifacts.ps1 -Signed
    - name: Publish signed release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$GITHUB_REF_NAME" output/release/*.exe output/release/SHA256SUMS output/release/NOTES.md \
          --verify-tag --target "$GITHUB_SHA" --title "Dispatcher $GITHUB_REF_NAME — C# + Go" --notes-file NOTES.md
